<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chibchombia — Gestión de pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra__marca">Chibchombia <span>· Gestión de pedidos</span></div>
    <div class="barra__usuario" id="barra-usuario" hidden>
      <span id="nombre-usuario"></span>
      <button id="boton-salir" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenido">
    <section id="vista-login" class="tarjeta-login">
      <h1>Acceso de personal</h1>
      <p>Inicia sesión con tu usuario del restaurante para consultar y gestionar los pedidos.</p>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" required autocomplete="username" autofocus>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="boton-login">Entrar</button>
        <p id="mensaje-login" class="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="vista-panel" class="panel" hidden>
      <div class="panel__filtros">
        <div class="filtros__estado" role="tablist" id="filtros-estado">
          <button type="button" data-estado="" class="filtro-estado is-activo" role="tab">Todos</button>
          <button type="button" data-estado="pendiente" class="filtro-estado" role="tab">Pendientes</button>
          <button type="button" data-estado="atendido" class="filtro-estado" role="tab">Atendidos</button>
        </div>
        <input type="search" id="buscar-cliente" class="buscar-cliente" placeholder="Buscar por cliente…">
        <button type="button" id="boton-actualizar" class="boton-actualizar">Actualizar</button>
      </div>

      <p id="estado-pedidos" class="estado-pedidos" aria-live="polite"></p>
      <div id="lista-pedidos" class="lista-pedidos"></div>
    </section>
  </main>

  <script src="logica.js" defer></script>
</body>
</html>
